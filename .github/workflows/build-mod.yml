name: Build mod DLL

# A DLL só pode ser compilada por quem tem acesso ao repositório PRIVADO
# Re-UE4SS/UEPseudo, submódulo obrigatório do RE-UE4SS. Não existe SDK
# publicado (a release zDEV não traz headers nem import library), então não há
# como compilar um mod C++ de UE4SS sem esse acesso.
#
# Com acesso: crie um PAT com permissão de leitura nesse repositório e guarde
# como o secret UEPSEUDO_PAT. Sem ele, este workflow para no primeiro passo e
# diz o que falta, em vez de falhar com "Permission denied (publickey)".
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  dll:
    name: mod DLL (windows)
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Verificar acesso ao UEPseudo
        shell: bash
        env:
          PAT: ${{ secrets.UEPSEUDO_PAT }}
        run: |
          if [ -z "$PAT" ]; then
            echo "::error::secret UEPSEUDO_PAT ausente."
            echo "Re-UE4SS/UEPseudo e privado e o RE-UE4SS nao compila sem ele."
            echo "Peca acesso a equipe do UE4SS e adicione o PAT como secret."
            exit 1
          fi

      - uses: actions/checkout@v4

      - name: Checkout RE-UE4SS
        shell: bash
        env:
          PAT: ${{ secrets.UEPSEUDO_PAT }}
        run: |
          # O .gitmodules do UE4SS usa SSH; reescrever para HTTPS com o token
          # e o que permite o clone sem chave no runner.
          git config --global url."https://x-access-token:$PAT@github.com/".insteadOf "git@github.com:"
          git clone --recursive --depth 1 --branch v3.0.1 https://github.com/UE4SS-RE/RE-UE4SS external/RE-UE4SS

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - uses: seanmiddleditch/gha-setup-ninja@v5

      - run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Game__Shipping__Win64
      - run: cmake --build build
      - run: cmake --build build --target package

      - uses: actions/upload-artifact@v4
        with:
          name: Atelier33
          path: build/dist/*.zip
          if-no-files-found: error

      - name: Publicar release na tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/dist/*.zip
