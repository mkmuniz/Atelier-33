name: Release

# Publica o zip instalável quando uma tag v* é empurrada.
#
#   git tag v0.1.0 && git push origin v0.1.0
on:
  push:
    tags: ["v*"]

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Checkout RE-UE4SS
        run: git clone --recursive --depth 1 --branch v3.0.1 https://github.com/UE4SS-RE/RE-UE4SS external/RE-UE4SS

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - uses: seanmiddleditch/gha-setup-ninja@v5

      - run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Game__Shipping__Win64
      - run: cmake --build build
      - run: cmake --build build --target package

      - uses: softprops/action-gh-release@v2
        with:
          files: build/dist/*.zip
          body: |
            Extraia em `Expedition 33\Sandfall\Binaries\Win64\ue4ss\Mods\`
            e adicione `PictoOptimizer : 1` ao `mods.txt`.

            Requer UE4SS instalado. Nada muda no jogo até você criar um
            override pelo menu (F9).
